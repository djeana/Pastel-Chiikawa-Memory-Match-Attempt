<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Cute Memory Matching Game</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #5c5470;
      background-color: #fff6f8;
      /* Soft pastel base behind the 50% art */
      position: relative;
    }

    /* Background artwork layer at 50% opacity */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.75;
      /* 50% opacity! */
      z-index: -1;
      /* Places the art strictly behind your game */
    }

    h1 {
      color: #5579c6;
      font-size: 38px;
      font-weight: 1000;
      letter-spacing: 1px;
      margin-bottom: 12px;
      -webkit-text-stroke: 2px #ffffff;
      paint-order: stroke fill;
      text-shadow: 0px 4px 0px #ffc2d4;
    }

    .stats {
      margin-bottom: 20px;
      font-size: 18px;
      display: flex;
      gap: 20px;
      background-color: #ffffff;
      padding: 10px 24px;
      border-radius: 50px;
      box-shadow: 0 4px 10px rgba(107, 140, 206, 0.15);
      border: 2px solid #ffd6e0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 110px);
      gap: 14px;
    }

    .card {
      width: 110px;
      height: 120px;
      background-color: #9ec1f7;
      background-image: radial-gradient(#ffffff 15%, transparent 16%);
      background-size: 18px 18px;
      color: #ffffff;
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      cursor: pointer;
      user-select: none;
      border: 4px solid #ffffff;
      box-shadow: 0 6px 0px #7ba3e0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0px #7ba3e0;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
      box-sizing: border-box;
      display: block;
    }

    .card.flipped {
      background-image: none;
      background-color: #fffdf7;
      border-color: #ffd166;
      box-shadow: 0 6px 0px #f4c04e;
    }

    .card.matched {
      background-image: none;
      background-color: #f0fff4;
      border-color: #8ce99a;
      box-shadow: 0 6px 0px #69db7c;
      cursor: default;
    }

    #play-again-btn {
      display: none;
      /* Hidden until you win! */
      margin-top: 24px;
      padding: 12px 28px;
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 700;
      background-color: #ff9ebb;
      color: white;
      border: 3px solid #ffffff;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0px #e07a9b;
      transition: transform 0.1s ease;
    }

    #play-again-btn:hover {
      background-color: #ff85a9;
    }

    #play-again-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0px #e07a9b;
    }

    #message {
      margin-top: 18px;
      font-size: 22px;
      font-weight: 700;
      color: #ff7597;
    }
  </style>
</head>

<body>

  <h1>✨ MEMORY MATCH ✨</h1>

  <div class="stats">
    <span>Attempts: <strong id="attempts">0</strong></span>
    <span>Matches: <strong id="matches">0</strong> / 6</span>
  </div>

  <div class="grid" id="game-board"></div>
  <div id="message"></div>
  <button id="play-again-btn" onclick="startGame()">Play Again</button>

  <script>
    // Make sure these 6 names match the PNG files in your folder
    const cardImages = [
      "pic1.png", "pic1.png",
      "pic2.png", "pic2.png",
      "pic3.png", "pic3.png",
      "pic4.png", "pic4.png",
      "pic5.png", "pic5.png",
      "pic6.png", "pic6.png"
    ];

    let deck = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let attempts = 0;
    let isLocked = false;

    function shuffle(array) {
      let currentIndex = array.length;
      while (currentIndex !== 0) {
        let randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    function startGame() {
      deck = shuffle([...cardImages]);
      flippedCards = [];
      matchedPairs = 0;
      attempts = 0;
      isLocked = false;

      document.getElementById("attempts").textContent = attempts;
      document.getElementById("matches").textContent = matchedPairs;
      document.getElementById("message").textContent = "";
      document.getElementById("play-again-btn").style.display = "none";

      const board = document.getElementById("game-board");
      board.innerHTML = "";

      deck.forEach((imagePath, index) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.image = imagePath;
        card.dataset.index = index;
        card.textContent = "★";
        card.addEventListener("click", () => handleCardClick(card));
        board.appendChild(card);
      });
    }

    function handleCardClick(card) {
      if (isLocked || card.classList.contains("matched") || flippedCards.includes(card)) {
        return;
      }

      card.classList.add("flipped");
      card.innerHTML = `<img src="${card.dataset.image}" alt="Chibi Card">`;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        attempts++;
        document.getElementById("attempts").textContent = attempts;
        checkForMatch();
      }
    }

    function checkForMatch() {
      const [firstCard, secondCard] = flippedCards;
      const isMatch = firstCard.dataset.image === secondCard.dataset.image;

      if (isMatch) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");
        matchedPairs++;
        document.getElementById("matches").textContent = matchedPairs;
        flippedCards = [];

        if (matchedPairs === cardImages.length / 2) {
          document.getElementById("message").textContent = `🎉 Yay! You matched them all in ${attempts} tries! 🎉`;
          document.getElementById("play-again-btn").style.display = "inline-block";
        }
      } else {
        isLocked = true;
        setTimeout(() => {
          firstCard.classList.remove("flipped");
          secondCard.classList.remove("flipped");
          firstCard.innerHTML = "★";
          secondCard.innerHTML = "★";
          flippedCards = [];
          isLocked = false;
        }, 1000);
      }
    }

    startGame();
  </script>

</body>

</html>
